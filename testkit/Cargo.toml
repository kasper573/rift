[package]
name = "testkit"
version.workspace = true
edition.workspace = true
description = "What the engine's tests and its server bench stand on: a game of only the rows declared, and a bare world running only the systems named"

[dependencies]
engine = { path = "../engine" }
bevy_ecs.workspace = true
bevy_math.workspace = true
bevy_replicon = { workspace = true, features = ["server"] }
bevy_time = { workspace = true, features = ["std"] }
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
hound = "3.5"
png = "0.18"
serde_json.workspace = true
strum.workspace = true

[lints]
workspace = true
