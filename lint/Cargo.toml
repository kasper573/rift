[package]
name = "lint"
version.workspace = true
edition.workspace = true
description = "The repo's own lints: layering, standalone crates, JSON by literal key, mapped messages and build profiles"

[dependencies]
cargo_metadata = "0.23"
proc-macro2 = { workspace = true, features = ["span-locations"] }
serde.workspace = true
syn = { workspace = true, features = ["visit"] }
toml = "1"
walkdir.workspace = true

[lints]
workspace = true
