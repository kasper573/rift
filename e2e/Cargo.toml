[package]
name = "e2e"
version.workspace = true
edition.workspace = true
description = "Cross-platform end-to-end test: drives the exact client binary CI releases against a live server on a real display and asserts on the pixels it renders."
publish = false

[lib]
path = "src/lib.rs"

# Drives the deployed stack through a real (headless) browser: `thirtyfour` speaks WebDriver to a
# `chromedriver` that `just e2e` launches, navigates to `/play`, registers an account, and screenshots
# the game canvas; the pixels are decoded with `png` and asserted on. Nothing here is OS-specific.
# The crate is excluded from the workspace `default-members`, so a plain `cargo build`/`test` skips it
# (it pulls a browser-automation stack); build it via `just e2e`.
[dev-dependencies]
png = "0.18"
thirtyfour = "0.37"
tokio = { workspace = true, features = ["time"] }
