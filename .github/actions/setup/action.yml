name: Set up the build environment
description: Pinned toolchain, just, and the Linux system libraries cargo can't provide.
inputs:
  deps:
    description: "Which Linux system libraries to install: none | build | all."
    default: build
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@v2
    - name: Install the pinned toolchain
      shell: bash
      run: rustup show
    - name: Install wasm-bindgen-cli matching the lockfile
      if: runner.os == 'Linux' && inputs.deps != 'none'
      shell: bash
      # `just wasm` post-processes the client with `wasm-bindgen`, whose version must match the
      # `wasm-bindgen` crate exactly; grab that prebuilt release rather than compiling the CLI.
      run: |
        version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = "|"/, ""); print}' Cargo.lock)
        curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp
        sudo install "/tmp/wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
        wasm-bindgen --version
    - name: Install Linux system libraries
      if: runner.os == 'Linux' && inputs.deps != 'none'
      shell: bash
      # `-sys` crates link system C libraries cargo can't supply (the one platform-specific place, per
      # the repo's platform rule): mold, the x11/gl libs, cmake/g++ for the native `ui` gallery and
      # `bevy_render`, and alsa for kira's cpal backend (the client audio code compiles natively too).
      # xvfb + the Mesa DRI driver are for the e2e's headed Firefox/WebKit (software WebGL). Drop the
      # runner's microsoft/azure apt sources first — unused, and they 403 intermittently.
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure*
        sudo apt-get update
        sudo apt-get install -y mold cmake g++ libx11-dev libxext-dev libxft-dev libxinerama-dev \
          libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev \
          xvfb libgl1-mesa-dri libasound2-dev
    - name: Set up Node for the e2e
      if: inputs.deps == 'all'
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    # Cache the engines Playwright downloads (Firefox/WebKit, ~180MB) keyed on the lockfile, which
    # pins their versions; `playwright install` then skips them on a hit. Chrome/Edge are apt channels.
    - name: Cache Playwright browsers
      if: runner.os == 'Linux' && inputs.deps == 'all'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
    - name: Install the e2e suite and its browsers
      if: runner.os == 'Linux' && inputs.deps == 'all'
      shell: bash
      working-directory: e2e
      run: |
        npm ci
        npx playwright install --with-deps chrome firefox webkit
