name: Set up the build environment
description: Pinned toolchain, just, the Linux system libraries cargo can't provide, and the build cache.
inputs:
  deps:
    description: "What the job builds, which decides the tools it gets: build | dist."
    default: build
  cache:
    description: "The build cache entry the job restores, one per kind of build."
    required: true
  recipes:
    description: "The just recipes the job builds with, whose source keys the cache entry."
    required: true
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    - name: Install the pinned toolchain
      shell: bash
      # Into a rustup home of its own, so the pinned toolchain is the only one installed: rust-cache keys
      # its entries by every installed toolchain, and the runner image's own changes with the image.
      run: |
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        RUSTUP_HOME="$RUNNER_TEMP/rustup" rustup toolchain install --no-self-update
    - name: Install wasm-bindgen-cli matching the lockfile
      if: runner.os == 'Linux' && inputs.deps == 'dist'
      shell: bash
      # `just wasm` post-processes the client with `wasm-bindgen`, whose version must match the
      # `wasm-bindgen` crate exactly; grab that prebuilt release rather than compiling the CLI.
      run: |
        version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = "|"/, ""); print}' Cargo.lock)
        curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp
        sudo install "/tmp/wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
        wasm-bindgen --version
    - name: Install Linux system libraries
      if: runner.os == 'Linux'
      shell: bash
      # The one system C library a `-sys` crate links that cargo can't supply (the one platform-specific
      # place, per the repo's platform rule): alsa, for kira's cpal backend (the client audio code
      # compiles natively too), found through pkg-config; the windowing and graphics libraries load at
      # runtime. Drop the runner's microsoft/azure apt sources first — unused, and they 403
      # intermittently.
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure*
        sudo apt-get update
        sudo apt-get install -y pkg-config libasound2-dev
    - name: Key the build cache by the recipes
      id: recipes
      shell: bash
      env:
        RECIPES: ${{ inputs.recipes }}
      run: |
        hash=$(for recipe in $RECIPES; do just --show "$recipe"; done | git hash-object --stdin | cut -c1-8)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
    # rust-cache is the sole build cache. Only main writes it and every branch reads main's, so it holds
    # one set of entries for main's lockfile whatever happens on branches, and the entries main
    # supersedes are the least recently used, the first evicted; branches therefore build only what main
    # builds. An entry is keyed by the manifests and lockfile, the job's cargo environment and the
    # recipes it builds with, so building differently never restores a stale entry it then can't
    # replace. A failing run saves too: the dependencies it built are no different. A per-object
    # compiler cache (sccache) is deliberately absent: on the GitHub Actions backend it writes thousands
    # of tiny entries that crowd out these.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache }}-${{ steps.recipes.outputs.hash }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: "true"
