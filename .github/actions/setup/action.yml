name: Set up the build environment
description: Pinned toolchain, just, and the Linux system libraries cargo can't provide.
inputs:
  deps:
    description: "Which Linux system libraries to install: none | build | all."
    default: build
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@v2
    - name: Install the pinned toolchain
      shell: bash
      run: rustup show
    - name: Install wasm-bindgen-cli matching the lockfile
      if: runner.os == 'Linux' && inputs.deps != 'none'
      shell: bash
      # `just wasm` post-processes the client with `wasm-bindgen`, whose version must match the
      # `wasm-bindgen` crate exactly; grab that prebuilt release rather than compiling the CLI.
      run: |
        version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = "|"/, ""); print}' Cargo.lock)
        curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp
        sudo install "/tmp/wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
        wasm-bindgen --version
    - name: Install Linux system libraries
      if: runner.os == 'Linux' && inputs.deps != 'none'
      shell: bash
      # `-sys` crates link system C libraries cargo can't supply; the repo's platform rule keeps them
      # here, the one platform-specific place. These cover the native `ui` gallery and `bevy_render`:
      # mold (linker), the x11/gl libs, and cmake/g++ for their build systems. `xvfb` and the Mesa DRI
      # driver are the e2e's: Firefox and WebKit can't drive WebGL headless, so they run headed against
      # a virtual display with software GL (see e2e/README.md). Drop the runner's microsoft/azure apt
      # sources first: nothing installs from them, but they 403 intermittently and fail `apt-get update`.
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure*
        sudo apt-get update
        sudo apt-get install -y mold cmake g++ libx11-dev libxext-dev libxft-dev libxinerama-dev \
          libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev \
          xvfb libgl1-mesa-dri
    - name: Set up Node for the e2e
      if: inputs.deps == 'all'
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install the e2e suite and its browsers
      if: runner.os == 'Linux' && inputs.deps == 'all'
      shell: bash
      working-directory: e2e
      # The Playwright suite and the browsers it drives (with their OS deps). Only Chrome and Edge are
      # installed: Firefox and WebKit are disabled in CI until we have faster runners (see the comment
      # in e2e/playwright.config.ts). Re-add `firefox webkit` here when re-enabling them there.
      run: |
        npm ci
        npx playwright install --with-deps chrome msedge
