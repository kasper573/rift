name: CI
on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_USERNAME: ${{ github.repository_owner }}
  DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  DOCKER_REGISTRY_URL: ghcr.io/${{ github.repository_owner }}
  DOCKER_IMAGE_VERSION: ${{ github.sha }}

jobs:
  build:
    # Pinned to match the image base (ubuntu:24.04) so host-built glibc binaries run in the images.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE: docker compose -f docker/docker-compose.yaml
      # keycloak and reverse-proxy depend only on their own Dockerfiles, so they are tagged by a
      # hash of those and the pushed image is reused across runs instead of rebuilding kc.sh/xcaddy.
      INFRA_TAG: infra-${{ hashFiles('docker/Dockerfile.keycloak', 'docker/Dockerfile.reverse-proxy') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: glibc-release
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      - name: Start keycloak in the background (overlaps its pull+boot with the build)
        run: |
          docker network inspect rift >/dev/null 2>&1 || docker network create rift
          cat > /tmp/prewarm.sh <<'SCRIPT'
          set -eux
          for service in keycloak reverse-proxy; do
            cached="$DOCKER_REGISTRY_URL/rift-$service:$INFRA_TAG"
            current="$DOCKER_REGISTRY_URL/rift-$service:$DOCKER_IMAGE_VERSION"
            if docker pull "$cached"; then
              docker tag "$cached" "$current"
            else
              $COMPOSE --profile prod build "$service"
              docker tag "$current" "$cached"
              docker push "$cached"
            fi
          done
          $COMPOSE --profile test up -d --no-build postgres keycloak keycloak-healthcheck
          SCRIPT
          nohup bash /tmp/prewarm.sh > /tmp/prewarm.log 2>&1 &
      - name: Conventions
        # The client ships as wasm, so it is linted for that target; the rest of the workspace is
        # linted natively, which keeps the client's native-only deps (ALSA) out of CI.
        run: |
          cargo fmt --check
          cargo clippy --workspace --exclude client --all-targets --all-features -- -D warnings
          cargo clippy -p client --target wasm32-unknown-unknown -- -D warnings
      - name: Build release artifacts
        run: |
          cargo build --release -p website -p server
          cargo wasm
      - name: Build docker images
        run: $COMPOSE --profile test build rift-website rift-game-server
      - name: E2E tests
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          $COMPOSE --profile test up -d --wait --no-build
          cargo test -p server --features stack -- --test-threads=1
      - name: Collect e2e test logs
        if: failure()
        run: |
          cat /tmp/prewarm.log || true
          mkdir -p e2e-docker-logs
          for id in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$id" | tr -d /)
            docker logs "$id" > "e2e-docker-logs/$name.log" 2>&1 || true
          done
      - name: Save e2e test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-docker-logs
          path: e2e-docker-logs/
      - name: Push docker images
        if: github.ref_name == 'main'
        run: $COMPOSE --profile prod push

  deploy:
    needs: [build]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload docker runtime dependencies
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: docker/
          remote_path: ~/docker
          remote_host: ${{ secrets.PROD_SSH_HOST }}
          remote_user: ${{ secrets.PROD_SSH_USERNAME }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy via SSH action
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        continue-on-error: true
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/docker

            # Set production host env vars; compose reads .env for interpolation and layering.
            echo "COMPOSE_ENV=prod" > .env
            echo "DOCKER_REGISTRY_URL=\"${{ env.DOCKER_REGISTRY_URL }}\"" >> .env
            echo "DOCKER_IMAGE_VERSION=\"${{ env.DOCKER_IMAGE_VERSION }}\"" >> .env
            echo "RIFT_DOMAIN=\"${{ vars.RIFT_DOMAIN }}\"" >> .env
            echo "KC_ADMIN_USERNAME=\"${{ secrets.KC_ADMIN_USERNAME }}\"" >> .env
            echo "KC_ADMIN_PASSWORD=\"${{ secrets.KC_ADMIN_PASSWORD }}\"" >> .env

            echo ${{ env.DOCKER_PASSWORD }} | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
            docker network inspect rift >/dev/null 2>&1 || docker network create rift
            docker compose --profile prod pull
            docker compose --profile prod down

            if ! docker compose --profile prod up -d --remove-orphans --no-build; then
              echo "🚨 docker-compose up failed — gathering all container logs"
              mkdir -p logs
              for id in $(docker ps -aq); do
                name=$(docker inspect --format='{{.Name}}' "$id" | sed 's#^/##')
                docker logs "$id" &> "logs/${name}.log" || true
              done
              tar czf deploy-failure-logs.tar.gz logs/
              exit 1
            fi

            docker image prune

      - name: Download deployment logs from server
        if: steps.deploy.outcome == 'failure'
        uses: nicklasfrahm/scp-action@main
        with:
          direction: download
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: ~/docker/deploy-failure-logs.tar.gz
          target: ./deploy-failure-logs.tar.gz
          insecure_ignore_fingerprint: true

      - name: Save deployment logs
        if: steps.deploy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-failure-logs
          path: ./deploy-failure-logs.tar.gz

      - name: Fail workflow on deploy error
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "🚨 Deployment failed — see deploy-failure-logs artifact for details."
          exit 1
