name: CI
on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_USERNAME: ${{ github.repository_owner }}
  DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  DOCKER_REGISTRY_URL: ghcr.io/${{ github.repository_owner }}
  DOCKER_IMAGE_VERSION: ${{ github.sha }}

jobs:
  build:
    # Pinned to match the image base (ubuntu:24.04) so host-built glibc binaries run in the images.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE: docker compose -f docker/docker-compose.yaml
      # CI runs the tests once and throws the artifacts away.
      # Without this the workspace's debug artifacts (Bevy) overflow the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk
        # The hosted runner ships ~25GB of unrelated toolchains; reclaim the space for target/.
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: glibc-release

      - name: Install system dependencies
        # Clippy compiles the client, which links ALSA through kira.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Conventions
        # `e2e` is excluded from the workspace `default-members` (it needs the heavy capture stack),
        # so plain `cargo clippy` lints the shipping crates; the e2e job lints it where that stack is
        # installed. `cargo fmt` still spans every member.
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Build release artifacts
        run: cargo build --release -p website -p server

      # The first-party images only package prebuilt binaries, so they build in seconds; the
      # keycloak/caddy images compile their plugins, so only main pays for the full set it pushes.
      - name: Build app images
        run: $COMPOSE --profile prod build rift-website rift-game-server
      - uses: docker/login-action@v3
        if: github.ref_name == 'main'
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Push docker images
        if: github.ref_name == 'main'
        run: |
          $COMPOSE --profile prod build
          $COMPOSE --profile prod push

  # The shipped client, byte-for-byte (the dist profile + features), driven through a real gameplay
  # session on each OS it ships to. The test builds nothing it can borrow — only the release client
  # and the server — and is `#[ignore]`d so it never runs in a developer's `cargo test`.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-${{ matrix.os }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # The client links ALSA (kira) and renders through a software Vulkan driver (lavapipe) onto a
        # headless Xvfb that openbox manages (xcap enumerates windows via EWMH, which needs a WM).
        # xcap compiles its whole Linux capture surface unconditionally — pipewire and the wayland
        # path (egl/gbm) it bundles alongside the X11 (xcb) capture we actually use — so their build
        # and link deps are all present even though only the X11 path runs here.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-6 libxcursor1 libxrandr2 libxi6 libxinerama1 libxkbcommon0 libxkbcommon-x11-0 \
            libvulkan1 mesa-vulkan-drivers \
            xvfb openbox \
            libclang-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-render0-dev

      - name: Lint the e2e crate
        if: runner.os == 'Linux'
        run: cargo clippy -p e2e --all-targets -- -D warnings

      - name: Start a virtual display
        if: runner.os == 'Linux'
        # The test drives genuine OS input and captures the real screen, so it needs an X display the
        # pipeline owns; macOS and Windows runners provide an interactive desktop already.
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 &
          for _ in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          DISPLAY=:99 openbox >/tmp/openbox.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Build the shipping client and the server
        shell: bash
        run: |
          cargo build --profile dist --features dist -p client
          cargo build --release -p server

      - name: E2E test
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          export RIFT_E2E_CLIENT="$PWD/target/dist/rift$ext"
          export RIFT_E2E_SERVER="$PWD/target/release/server$ext"
          cargo test -p e2e -- --ignored --nocapture

      - name: Save E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: target/tmp/

  deploy:
    needs: [build, e2e]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Upload docker runtime dependencies
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: docker/
          remote_path: ~/docker
          remote_host: ${{ secrets.PROD_SSH_HOST }}
          remote_user: ${{ secrets.PROD_SSH_USERNAME }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy via SSH action
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        continue-on-error: true
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/docker

            # Set production host env vars; compose reads .env for interpolation and layering.
            echo "COMPOSE_ENV=prod" > .env
            echo "DOCKER_REGISTRY_URL=\"${{ env.DOCKER_REGISTRY_URL }}\"" >> .env
            echo "DOCKER_IMAGE_VERSION=\"${{ env.DOCKER_IMAGE_VERSION }}\"" >> .env
            echo "RIFT_DOMAIN=\"${{ vars.RIFT_DOMAIN }}\"" >> .env
            echo "KC_ADMIN_USERNAME=\"${{ secrets.KC_ADMIN_USERNAME }}\"" >> .env
            echo "KC_ADMIN_PASSWORD=\"${{ secrets.KC_ADMIN_PASSWORD }}\"" >> .env

            echo ${{ env.DOCKER_PASSWORD }} | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
            docker network inspect rift >/dev/null 2>&1 || docker network create rift
            docker compose --profile prod pull
            docker compose --profile prod down

            if ! docker compose --profile prod up -d --remove-orphans --no-build; then
              echo "🚨 docker-compose up failed — gathering all container logs"
              mkdir -p logs
              for id in $(docker ps -aq); do
                name=$(docker inspect --format='{{.Name}}' "$id" | sed 's#^/##')
                docker logs "$id" &> "logs/${name}.log" || true
              done
              tar czf deploy-failure-logs.tar.gz logs/
              exit 1
            fi

            docker image prune

      - name: Download deployment logs from server
        if: steps.deploy.outcome == 'failure'
        uses: nicklasfrahm/scp-action@main
        with:
          direction: download
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: ~/docker/deploy-failure-logs.tar.gz
          target: ./deploy-failure-logs.tar.gz
          insecure_ignore_fingerprint: true

      - name: Save deployment logs
        if: steps.deploy.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: deploy-failure-logs
          path: ./deploy-failure-logs.tar.gz

      - name: Fail workflow on deploy error
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "🚨 Deployment failed — see deploy-failure-logs artifact for details."
          exit 1
