name: build · test · release · deploy

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_USERNAME: ${{ github.repository_owner }}
  DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  DOCKER_REGISTRY_URL: ghcr.io/${{ github.repository_owner }}
  DOCKER_IMAGE_VERSION: ${{ github.sha }}
  # crates.io downloads flake over HTTP/2 ("error in the HTTP2 framing layer"); force HTTP/1.1 and
  # retry hard so a cold cache doesn't fail the run on a transient blip.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Install system dependencies
        # Clippy compiles the client, which links ALSA through kira.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

  # The cross-platform job: only the client ships to multiple OSes, so only it (and the server the
  # e2e drives) is built per OS. Each OS builds the client, drives it through a real gameplay session
  # against a freshly built server, then uploads the tested binary — so release and deploy ship
  # exactly what ran here.
  build_and_test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, asset: rift-linux-x86_64 }
          - { os: macos-latest, asset: rift-macos-aarch64 }
          - { os: windows-latest, asset: rift-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        run: rustup show
      - name: Exclude the build from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        # Real-time AV scanning of every object cargo writes roughly doubles the Windows build.
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo"
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-and-test-${{ matrix.os }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # The client links ALSA (kira) and renders through a software Vulkan driver (lavapipe) onto a
        # headless Xvfb that openbox manages (xcap enumerates windows via EWMH, which needs a WM).
        # xcap compiles its whole linux capture surface — pipewire and the wayland path (egl/gbm)
        # alongside the X11 (xcb) path we use.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-6 libxcursor1 libxrandr2 libxi6 libxinerama1 libxkbcommon0 libxkbcommon-x11-0 \
            libvulkan1 mesa-vulkan-drivers \
            xvfb openbox \
            libclang-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-render0-dev
      - name: Build the client and the server
        shell: bash
        # The client is the released artifact; the server is the backend the e2e drives. Both use the
        # release profile so they share one dependency compilation.
        run: |
          cargo build --release --features dist -p client
          cargo build --release -p server
      - name: Start a virtual display
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 &
          for _ in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          DISPLAY=:99 openbox >/tmp/openbox.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: E2E test
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          export RIFT_E2E_CLIENT="$PWD/target/release/rift$ext"
          export RIFT_E2E_SERVER="$PWD/target/release/server$ext"
          cargo test -p e2e -- --ignored --nocapture
      - name: Save E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: target/tmp/
      - name: Stage the client
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p out
          cp "target/release/rift$ext" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.os }}
          path: out/
      - name: Upload the server for the deploy images
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: server-linux
          path: target/release/server

  # Branch builds stop at build_and_test; main publishes and deploys what it just tested.
  release:
    needs: build_and_test
    # TEMP: while perfecting the flow it runs on every branch. Restore `if: github.ref_name ==
    # 'main'` when done.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: client-*
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The version is `0.<run number>`: simple and monotonic, and the `0.` major keeps these
        # automated releases out of the semver space a real version would later claim.
        # TEMP: `temp-` prefix keeps in-progress release runs out of the version space. Restore the
        # plain `0.<run number>` when the release flow is perfected.
        run: |
          version="temp-0.${{ github.run_number }}"
          gh release create "$version" dist/client-*/rift-* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$version" \
            --notes "Automated release of ${{ github.sha }}."

  # Only the linux server/website ship as docker images. The server is the very binary the e2e drove;
  # the website is built here since nothing else needs it.
  deploy:
    needs: build_and_test
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: deploy
      - name: Build the website
        run: cargo build --release -p website
      - uses: actions/download-artifact@v7
        with:
          name: server-linux
          path: server-bin
      - name: Stage the binaries the images package
        run: |
          mkdir -p target/release
          cp server-bin/server target/release/server
      - name: Build and push the app images
        env:
          COMPOSE: docker compose -f docker/docker-compose.yaml
        run: |
          echo "${{ env.DOCKER_PASSWORD }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
          $COMPOSE --profile prod build rift-website rift-game-server
          $COMPOSE --profile prod push rift-website rift-game-server

      - name: Upload docker runtime dependencies
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: docker/
          remote_path: ~/docker
          remote_host: ${{ secrets.PROD_SSH_HOST }}
          remote_user: ${{ secrets.PROD_SSH_USERNAME }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy via SSH action
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        continue-on-error: true
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/docker

            # Set production host env vars; compose reads .env for interpolation and layering.
            echo "COMPOSE_ENV=prod" > .env
            echo "DOCKER_REGISTRY_URL=\"${{ env.DOCKER_REGISTRY_URL }}\"" >> .env
            echo "DOCKER_IMAGE_VERSION=\"${{ env.DOCKER_IMAGE_VERSION }}\"" >> .env
            echo "RIFT_DOMAIN=\"${{ vars.RIFT_DOMAIN }}\"" >> .env
            echo "KC_ADMIN_USERNAME=\"${{ secrets.KC_ADMIN_USERNAME }}\"" >> .env
            echo "KC_ADMIN_PASSWORD=\"${{ secrets.KC_ADMIN_PASSWORD }}\"" >> .env

            echo ${{ env.DOCKER_PASSWORD }} | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
            docker network inspect rift >/dev/null 2>&1 || docker network create rift
            docker compose --profile prod pull
            docker compose --profile prod down

            if ! docker compose --profile prod up -d --remove-orphans --no-build; then
              echo "🚨 docker-compose up failed — gathering all container logs"
              mkdir -p logs
              for id in $(docker ps -aq); do
                name=$(docker inspect --format='{{.Name}}' "$id" | sed 's#^/##')
                docker logs "$id" &> "logs/${name}.log" || true
              done
              tar czf deploy-failure-logs.tar.gz logs/
              exit 1
            fi

            docker image prune

      - name: Download deployment logs from server
        if: steps.deploy.outcome == 'failure'
        uses: nicklasfrahm/scp-action@main
        with:
          direction: download
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: ~/docker/deploy-failure-logs.tar.gz
          target: ./deploy-failure-logs.tar.gz
          insecure_ignore_fingerprint: true

      - name: Save deployment logs
        if: steps.deploy.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: deploy-failure-logs
          path: ./deploy-failure-logs.tar.gz

      - name: Fail workflow on deploy error
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "🚨 Deployment failed — see deploy-failure-logs artifact for details."
          exit 1
