name: release

on:
  push:
    branches: [main]

# Deploys must never be cancelled mid-way; later pushes queue behind the running one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_USERNAME: ${{ github.repository_owner }}
  DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  DOCKER_REGISTRY_URL: ghcr.io/${{ github.repository_owner }}
  DOCKER_IMAGE_VERSION: ${{ github.sha }}
  # crates.io downloads flake over HTTP/2 ("error in the HTTP2 framing layer"); force HTTP/1.1 and
  # retry hard so a cold cache doesn't fail the run on a transient blip.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # Only the client ships to multiple OSes, so only it builds per OS; linux additionally builds
  # everything the stack images package.
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, asset: rift-linux-x86_64 }
          - { os: macos-latest, asset: rift-macos-aarch64 }
          - { os: windows-latest, asset: rift-windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        run: rustup show
      - name: Exclude the build from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        # Real-time AV scanning of every object cargo writes roughly doubles the Windows build.
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo"
      - name: Speed up the Windows release codegen
        if: runner.os == 'Windows'
        shell: bash
        # Windows is the slowest compiler; finer codegen units cut its build by ~20s for a small
        # optimisation cost on the Windows artifact only. rust-cache folds this CARGO_* var into its
        # key, so Windows pays one cold build to adopt it.
        run: echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # The client links ALSA through kira; the installer's fltk GUI is built from source on Linux, so
        # it needs cmake plus the X11/GL/pango headers. macOS and Windows build fltk with their own toolchains.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure*
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake g++ libx11-dev libxext-dev libxft-dev \
            libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev \
            libgl1-mesa-dev libglu1-mesa-dev
      - name: Build the client and the installer
        shell: bash
        # Both are environment-agnostic; the prod .env packaged into the installer archive configures the
        # installer and, through it, the client the installer launches.
        run: cargo build --release -p client -p installer --features installer/frontend
      - name: Package the client and the installer
        shell: bash
        # The player downloads only the installer archive (binary + .env) and runs it; the installer
        # fetches the client, the assets, and any newer installer into the same folder. The client archive
        # is binary-only: the installer carries the one .env, so nothing collides when they land together.
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          pkg="${{ matrix.asset }}"
          inst="rift-installer-${pkg#rift-}"
          mkdir -p "stage/$pkg" "stage/$inst" out
          cp "target/release/rift$ext" "stage/$pkg/rift$ext"
          cp "target/release/rift-installer$ext" "stage/$inst/rift-installer$ext"
          cat > "stage/$inst/.env" <<EOF
          RIFT_CLIENT_ISSUER=https://auth.${{ vars.RIFT_DOMAIN }}/realms/rift
          RIFT_CLIENT_GAME_SERVER_URL=https://game-server.${{ vars.RIFT_DOMAIN }}
          RIFT_ASSETS_DIR=assets
          RIFT_INSTALLER_METADATA_URL=https://installer.${{ vars.RIFT_DOMAIN }}
          RIFT_CLIENT_EXECUTABLE=rift$ext
          EOF
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "stage/$pkg"  && 7z a -tzip "../../out/$pkg.zip"  . >/dev/null)
            (cd "stage/$inst" && 7z a -tzip "../../out/$inst.zip" . >/dev/null)
          else
            tar czf "out/$pkg.tar.gz"  -C "stage/$pkg"  .
            tar czf "out/$inst.tar.gz" -C "stage/$inst" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.os }}
          path: out/
      - name: Package the assets
        if: runner.os == 'Linux'
        # Assets are platform-independent, so build the one archive on the Linux leg. Players download
        # it alongside their OS binary and extract it next to the binary, where the client finds it.
        run: |
          mkdir -p assets-out
          zip -r assets-out/rift-assets.zip assets
      - name: Upload the assets archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: assets-archive
          path: assets-out/
      - name: Build the server, the website, the installer backend, and the keycloak provisioning input
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p server -p website
          cargo build --release -p installer --features backend --bin installer-backend
          cargo run --release -p world --bin kc-roles > docker/keycloak/roles.conf
      - name: Upload the stack inputs for the deploy images
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: stack-linux
          path: |
            target/release/server
            target/release/website
            target/release/installer-backend
            docker/keycloak/roles.conf

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # The workflow is the single source of truth for where downloads live: it derives these from the
    # release it just published, and the deploy job feeds them to the website and the installer backend.
    outputs:
      version: ${{ steps.publish.outputs.version }}
      release_artifact_links: ${{ steps.publish.outputs.release_artifact_links }}
      installer_links: ${{ steps.publish.outputs.installer_links }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: client-*
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: assets-archive
          path: dist-assets
      - name: Publish the release and derive its download links
        id: publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          version="0.$(( ${{ github.run_number }} + 100 ))"
          gh release create "$version" dist/client-*/rift-* dist-assets/rift-assets.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$version" \
            --notes "Automated release of ${{ github.sha }}."
          # Read the asset download URLs back from the published release. release_artifact_links is every
          # asset (the installer backend filters per platform); installer_links is the per-OS installers
          # the downloads page links. One API call so both views describe the exact files just uploaded.
          assets=$(gh release view "$version" --repo "${{ github.repository }}" --json assets)
          {
            echo "version=$version"
            echo "release_artifact_links=$(jq -r '[.assets[].url] | join(",")' <<<"$assets")"
            echo "installer_links=$(jq -r '[.assets[] | select(.name | startswith("rift-installer-")) | .url] | join(",")' <<<"$assets")"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: stack-linux
          path: .
      - name: Restore the executable bits artifact transport may drop
        run: chmod +x target/release/server target/release/website target/release/installer-backend
      - name: Build and push the stack images
        env:
          COMPOSE: docker compose -f docker/docker-compose.yaml
        run: |
          echo "${{ env.DOCKER_PASSWORD }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
          $COMPOSE --profile prod build rift-website rift-installer rift-game-server keycloak reverse-proxy
          $COMPOSE --profile prod push rift-website rift-installer rift-game-server keycloak reverse-proxy

      - name: Upload docker runtime dependencies
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: docker/
          remote_path: ~/docker
          remote_host: ${{ secrets.PROD_SSH_HOST }}
          remote_user: ${{ secrets.PROD_SSH_USERNAME }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy via SSH action
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        continue-on-error: true
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/docker

            # Set production host env vars; compose reads .env for interpolation and layering.
            echo "COMPOSE_ENV=prod" > .env
            echo "DOCKER_REGISTRY_URL=\"${{ env.DOCKER_REGISTRY_URL }}\"" >> .env
            echo "DOCKER_IMAGE_VERSION=\"${{ env.DOCKER_IMAGE_VERSION }}\"" >> .env
            echo "RIFT_DOMAIN=\"${{ vars.RIFT_DOMAIN }}\"" >> .env
            # Download URLs derived by the release job from the release it just published. The website
            # lists the per-OS installers; the installer backend serves the full set, filtered per platform.
            echo "RIFT_INSTALLER_LINKS=\"${{ needs.release.outputs.installer_links }}\"" >> .env
            echo "RIFT_RELEASE_ARTIFACT_LINKS=\"${{ needs.release.outputs.release_artifact_links }}\"" >> .env
            echo "RIFT_VERSION=\"${{ needs.release.outputs.version }}\"" >> .env

            echo ${{ env.DOCKER_PASSWORD }} | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
            docker network inspect rift >/dev/null 2>&1 || docker network create rift
            docker compose --profile prod pull
            docker compose --profile prod down

            if ! docker compose --profile prod up -d --remove-orphans --no-build; then
              echo "🚨 docker-compose up failed — gathering all container logs"
              mkdir -p logs
              for id in $(docker ps -aq); do
                name=$(docker inspect --format='{{.Name}}' "$id" | sed 's#^/##')
                docker logs "$id" &> "logs/${name}.log" || true
              done
              tar czf deploy-failure-logs.tar.gz logs/
              exit 1
            fi

            docker image prune

      - name: Download deployment logs from server
        if: steps.deploy.outcome == 'failure'
        uses: nicklasfrahm/scp-action@main
        with:
          direction: download
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: ~/docker/deploy-failure-logs.tar.gz
          target: ./deploy-failure-logs.tar.gz
          insecure_ignore_fingerprint: true

      - name: Save deployment logs
        if: steps.deploy.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: deploy-failure-logs
          path: ./deploy-failure-logs.tar.gz

      - name: Fail workflow on deploy error
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "🚨 Deployment failed — see deploy-failure-logs artifact for details."
          exit 1
