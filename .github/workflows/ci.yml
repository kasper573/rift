name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Branch runs cancel superseded runs; main runs queue so deploys never overlap or cancel mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The quality gate on every push: lint, unit tests, and the browser e2e against the full stack.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # mold is a native linker; scope it to the host target so the wasm build (rust-lld) ignores it.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
      # Build unoptimized: far faster, and the e2e asserts on what the game renders, not framerate.
      # The deploy job rebuilds at full opt for the images it ships.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup
        with:
          deps: all
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: gate
          save-if: ${{ github.ref_name == 'main' }}
      - name: Lint and test
        run: |
          just lint
          just test
      - name: End-to-end test
        # `just e2e` builds the binaries and the wasm bundle, brings the stack up (website serving the
        # baked wasm), then drives headless Chrome through registration and gameplay.
        run: just e2e
      - name: Save e2e artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts
          path: target/tmp/
      - name: Save stack logs
        if: failure()
        run: just logs > /tmp/stack.log 2>&1 || true
      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stack-logs
          path: /tmp/stack.log

  # main only: rebuild at full opt, build and push the stack images, and deploy to production.
  deploy:
    needs: gate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/bevy-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
      DOCKER_REGISTRY: ghcr.io
      DOCKER_USERNAME: ${{ github.repository_owner }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_REGISTRY_URL: ghcr.io/${{ github.repository_owner }}
      DOCKER_IMAGE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup
        with:
          deps: build
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: deploy
      - name: Build the optimized server, website, and wasm bundle
        run: |
          just build
          just wasm
      - name: Build and push the stack images
        # The website image bakes in the wasm bundle; the game-server image its server binary.
        run: |
          echo "${{ env.DOCKER_PASSWORD }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
          just push-images
      - name: Upload docker runtime dependencies
        uses: burnett01/rsync-deployments@796cf0d5e4b535745ce49d7429f77cf39e25ef39 # 7.0.1
        with:
          switches: -avz --delete
          path: docker/
          remote_path: ~/docker
          remote_host: ${{ secrets.PROD_SSH_HOST }}
          remote_user: ${{ secrets.PROD_SSH_USERNAME }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}
      - name: Deploy via SSH action
        id: deploy
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        continue-on-error: true
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/docker

            echo "COMPOSE_ENV=prod" > .env
            echo "DOCKER_REGISTRY_URL=\"${{ env.DOCKER_REGISTRY_URL }}\"" >> .env
            echo "DOCKER_IMAGE_VERSION=\"${{ env.DOCKER_IMAGE_VERSION }}\"" >> .env
            echo "RIFT_DOMAIN=\"${{ vars.RIFT_DOMAIN }}\"" >> .env

            echo ${{ env.DOCKER_PASSWORD }} | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
            docker network inspect rift >/dev/null 2>&1 || docker network create rift
            docker compose --profile prod pull
            docker compose --profile prod down
            if ! docker compose --profile prod up -d --remove-orphans --no-build; then
              echo "🚨 docker-compose up failed — gathering all container logs"
              mkdir -p logs
              for id in $(docker ps -aq); do
                name=$(docker inspect --format='{{.Name}}' "$id" | sed 's#^/##')
                docker logs "$id" &> "logs/${name}.log" || true
              done
              tar czf deploy-failure-logs.tar.gz logs/
              exit 1
            fi
            docker image prune -f
      - name: Download deployment logs from server
        if: steps.deploy.outcome == 'failure'
        uses: nicklasfrahm/scp-action@ff9723c16c864e37adf7ef4111362b86905bfb04 # v1.0.1
        with:
          direction: download
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: ~/docker/deploy-failure-logs.tar.gz
          target: ./deploy-failure-logs.tar.gz
          insecure_ignore_fingerprint: true
      - name: Save deployment logs
        if: steps.deploy.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-failure-logs
          path: ./deploy-failure-logs.tar.gz
      - name: Fail workflow on deploy error
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "🚨 Deployment failed — see deploy-failure-logs artifact for details."
          exit 1
