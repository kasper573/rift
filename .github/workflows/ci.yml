name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Branch runs cancel superseded runs; main runs queue so deploys never overlap or cancel mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  # One job for every push: lint, test, build, and e2e. The branch decides two things and nothing
  # else — how hard to optimize, and whether to deploy. main builds the optimized artifacts, runs the
  # e2e against those exact binaries, then packages and ships them; branches build unoptimized and stop
  # after the e2e. The images only package the host-built crates, so the deploy reuses the e2e build —
  # no second compile, no artifact hand-off between jobs, and the e2e always ran on what we deploy.
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # rust-cache restores the registry and compiled dependencies across runs. Incremental off: the
      # per-run incremental artifacts are large and machine-specific, so caching a lean shared-dep
      # target/ restores far more than it costs.
      CARGO_INCREMENTAL: "0"
      DEPLOY: ${{ github.ref == 'refs/heads/main'  }}
      DOCKER_REGISTRY: ghcr.io
      DOCKER_USERNAME: ${{ github.repository_owner }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_REGISTRY_URL: ghcr.io/${{ github.repository_owner }}
      DOCKER_IMAGE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup
        with:
          deps: all
      # The sole build cache. A per-object compiler cache (sccache) is deliberately absent: on the GitHub
      # Actions backend it writes thousands of tiny entries that exhaust the repo's 10 GB cache quota and
      # evict this one, so the whole dependency graph recompiled from cold every run.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # main builds optimized and branches don't, so they keep separate caches to avoid rebuilding
          # dependencies at the other's opt-level on every run.
          key: ci-${{ github.ref == 'refs/heads/main' && 'main' || 'branch' }}
          # Save the dependency cache even when the run fails (e.g. a flaky e2e), so the next push doesn't
          # recompile every dependency from cold.
          cache-on-failure: "true"
      - name: Lint and test
        # Unoptimized: lint and unit tests don't ship, so build them fast regardless of branch.
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
        run: |
          just lint
          just test
      - name: Build
        # main deploys the server at the release default and the wasm shrunk with z + LTO + strip
        # (~44MB) for mobile Safari's per-tab memory. Branches build the server unoptimized (not the
        # e2e bottleneck) but the wasm at opt-3 — the e2e's software-rendered browsers need a client
        # fast enough to keep up, and opt-3 wasm costs only seconds more to build than opt-0.
        run: |
          if [ "$DEPLOY" = "true" ]; then
            just build
            CARGO_PROFILE_RELEASE_OPT_LEVEL=z CARGO_PROFILE_RELEASE_LTO=true CARGO_PROFILE_RELEASE_STRIP=symbols CARGO_INCREMENTAL=0 just wasm
          else
            CARGO_PROFILE_RELEASE_OPT_LEVEL=0 just build
            CARGO_PROFILE_RELEASE_OPT_LEVEL=3 just wasm
          fi
      - name: Start the stack
        # rift.lan only resolves on a LAN; map it to loopback for the browsers that take no
        # host-resolver flag (Firefox/WebKit).
        run: |
          echo "127.0.0.1 rift.lan auth.rift.lan game-server.rift.lan grafana.rift.lan" | sudo tee -a /etc/hosts
          # Docker Hub rate-limits anonymous CI pulls intermittently; retry past a transient failure.
          for attempt in 1 2 3; do
            just e2e-stack-up && break
            [ "$attempt" = 3 ] && { echo "::error::stack failed to start after $attempt attempts"; exit 1; }
            echo "::warning::stack-up attempt $attempt failed (likely a transient Docker Hub pull); retrying"
            sleep 20
          done
      # Its own step so the duration reflects the tests, not the stack build.
      - name: End-to-end test
        env:
          E2E_ALL_BROWSERS: "1"
        run: just e2e-run
      - name: Save e2e artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/
      - name: Save stack logs
        if: failure()
        run: just logs > /tmp/stack.log 2>&1 || true
      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stack-logs
          path: /tmp/stack.log
      - name: Build and push the stack images
        if: ${{ env.DEPLOY == 'true' }}
        # The website image bakes in the wasm bundle; the game-server image its server binary — both the
        # exact artifacts the e2e just ran against, repackaged for the prod registry (a docker cache hit).
        run: |
          echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
          just push-images
      - name: Upload docker runtime dependencies
        if: ${{ env.DEPLOY == 'true' }}
        uses: burnett01/rsync-deployments@796cf0d5e4b535745ce49d7429f77cf39e25ef39 # 7.0.1
        with:
          switches: -avz --delete
          path: docker/
          remote_path: ~/docker
          remote_host: ${{ secrets.PROD_SSH_HOST }}
          remote_user: ${{ secrets.PROD_SSH_USERNAME }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}
      - name: Deploy via SSH action
        if: ${{ env.DEPLOY == 'true' }}
        id: deploy
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        continue-on-error: true
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/docker

            echo "COMPOSE_ENV=prod" > .env
            echo "DOCKER_REGISTRY_URL=\"${{ env.DOCKER_REGISTRY_URL }}\"" >> .env
            echo "DOCKER_IMAGE_VERSION=\"${{ env.DOCKER_IMAGE_VERSION }}\"" >> .env
            echo "RIFT_DOMAIN=\"${{ vars.RIFT_DOMAIN }}\"" >> .env

            echo ${{ env.DOCKER_PASSWORD }} | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
            docker network inspect rift >/dev/null 2>&1 || docker network create rift
            docker compose --profile prod pull
            docker compose --profile prod down
            if ! docker compose --profile prod up -d --remove-orphans --no-build; then
              echo "🚨 docker-compose up failed — gathering all container logs"
              mkdir -p logs
              for id in $(docker ps -aq); do
                name=$(docker inspect --format='{{.Name}}' "$id" | sed 's#^/##')
                docker logs "$id" &> "logs/${name}.log" || true
              done
              tar czf deploy-failure-logs.tar.gz logs/
              exit 1
            fi
            docker image prune -f
      - name: Download deployment logs from server
        if: ${{ env.DEPLOY == 'true' && steps.deploy.outcome == 'failure' }}
        uses: nicklasfrahm/scp-action@ff9723c16c864e37adf7ef4111362b86905bfb04 # v1.0.1
        with:
          direction: download
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: ~/docker/deploy-failure-logs.tar.gz
          target: ./deploy-failure-logs.tar.gz
          insecure_ignore_fingerprint: true
      - name: Save deployment logs
        if: ${{ env.DEPLOY == 'true' && steps.deploy.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-failure-logs
          path: ./deploy-failure-logs.tar.gz
      - name: Fail workflow on deploy error
        if: ${{ env.DEPLOY == 'true' && steps.deploy.outcome == 'failure' }}
        run: |
          echo "🚨 Deployment failed — see deploy-failure-logs artifact for details."
          exit 1
