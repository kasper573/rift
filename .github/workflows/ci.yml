name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Branch runs cancel superseded runs; main runs queue so releases never overlap or cancel mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # rust-cache restores compiled dependencies; workspace crates rebuild every run, so their
  # incremental artifacts would only bloat the cache.
  CARGO_INCREMENTAL: "0"

# Every push runs lint, test and every platform's binaries side by side, each on a runner of its own;
# main releases the binaries once all of them pass.
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Unoptimized, with line tables alone: nothing lint builds ships or is stepped through.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache: lint
          recipes: lint
      - name: Lint
        run: just lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The record store's tests run on a file wherever they run, and here on a database server too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: records
          POSTGRES_DB: records
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Unoptimized, with line tables alone: the tests neither ship nor are stepped through.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RIFT_TEST_RECORD_STORE: postgres://postgres:records@localhost:5432/records
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          deps: test
          cache: test
          recipes: test
      - name: Test
        run: just test

  # A build is named by the release it would be, its commit's day and hash, so a server reports the
  # release a client finds its archive in.
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        run: echo "tag=$(TZ=UTC git log -1 --date=format-local:%Y.%m.%d --format=%cd)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

  # Every push builds every platform's binaries, so a change that breaks a platform fails on its
  # branch; main's runs hand them on to the release. Linux builds on the oldest supported runner, as
  # a binary needs at least the glibc it was linked against, and it alone builds what only runs on
  # Linux: the web-server and game-server-profiling.
  binaries:
    needs: [tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          deps: dist
          cache: dist-${{ matrix.platform }}
          recipes: dist archives smoke
      - name: Build the binaries
        shell: bash
        env:
          RIFT_BUILD: ${{ needs.tag.outputs.tag }}
        run: |
          RIFT_RELEASE_KEY="$(tail -n 1 release.pub)" just dist target/dist profiling
          just archives "${{ matrix.platform }}" target/dist target/archives
      - name: Smoke-test the website, the game server and the game client
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: just smoke target/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          name: archives-${{ matrix.platform }}
          path: target/archives/
          compression-level: 0
          retention-days: 1

  # One release per push to main, tagged by its day and commit, holding every platform's archives.
  # Releases are never replaced. Older ones are thinned out as the README's retention schedule promises,
  # and only once a newer release is out.
  release:
    needs: [tag, lint, test, binaries]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          path: archives
          merge-multiple: true
      # A client installs only an archive signed by the release key it was built with.
      - name: Sign the archives
        env:
          RIFT_RELEASE_SECRET_KEY: ${{ secrets.RIFT_RELEASE_SECRET_KEY }}
        run: |
          sudo apt-get install -y minisign
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RIFT_RELEASE_SECRET_KEY" > "$key"
          for archive in archives/*; do
            minisign -S -s "$key" -m "$archive" < /dev/null
          done
      - name: Publish the release
        env:
          tag: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "$tag" archives/* --target "$GITHUB_SHA" \
            --title "rift $tag" \
            --notes "Every binary of rift, built from $GITHUB_SHA: an archive per binary and platform, each with its minisign signature. Extract any of them into one folder to use them together."
      - name: Prune old releases
        shell: bash
        run: |
          gh release list --exclude-drafts --limit 1000 --json tagName,publishedAt --jq '
            sort_by(.publishedAt) | reverse
            | reduce .[] as $release ({kept: {}, pruned: []};
                ($release.publishedAt[:10]) as $day
                | ($release.publishedAt[:7]) as $month
                | ((now - ($release.publishedAt | fromdateiso8601)) / 86400) as $age_days
                | (if $age_days < 2 then true
                   elif $age_days < 30 then .kept[$day] | not
                   else .kept[$month] | not end) as $keep
                | .kept[$day] = true
                | .kept[$month] = true
                | if $keep then . else .pruned += [$release.tagName] end)
            | .pruned[]' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
