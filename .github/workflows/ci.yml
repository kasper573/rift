name: ci

# Branch push (pillar 2): lint + test + e2e on Linux against the full stack.
# main push (pillar 1): the above, then build the other platforms, publish the release, deploy to prod.
# Tags are excluded so the RELEASE_TOKEN-made 0.x tag can't re-trigger CI.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Branch runs cancel superseded runs; main runs queue so deploys never overlap or get cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The release's own download-naming scheme, referenced by packaging and the link derivation below.
  # The deploy job owns the DOCKER_* registry/version vars; the test stack uses compose's defaults so
  # its image tags stay stable across commits (prewarm-friendly).
  INSTALLER_PREFIX: rift-installer-
  ASSETS_ZIP: rift-assets.zip

jobs:
  # Everything on Linux: the quality gate every push must pass, and — on main — the source of the
  # Linux release/stack artifacts. The gate already compiles the release workspace, so building the
  # artifacts here costs nothing extra and the Bevy workspace compiles once per push.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # mold links the Bevy binaries far faster than the default linker (installed by the setup action).
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      # Non-release CI compiles the test-stack/e2e binaries at opt-level 0 — the gameplay test only
      # checks that the server-driven player visibly walks, which is position- not framerate-bound, so
      # unoptimized binaries pass it while building far faster. The shipped artifacts override this back
      # to full opt (the main-only "Build and stage" step below and the windows-macos job).
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v2
      - name: Prewarm the stack infra in the background
        # `just prewarm` only pulls externals and builds the keycloak + reverse-proxy images — no app
        # binaries, no roles.conf, no boot — so it runs from here, overlapping the apt setup, the cache
        # restore and the whole compile below; the stack boot then reuses the built layers. nohup
        # detaches it so it outlives this step; it signals its sentinel even on failure (the boot can
        # rebuild the images itself) so a failed prewarm never makes the boot wait out its timeout.
        run: nohup bash -c 'just prewarm; touch /tmp/prewarm.done' > /tmp/prewarm.log 2>&1 &
      - uses: ./.github/actions/setup
        with:
          deps: all
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
          save-if: ${{ github.ref_name == 'main' }}
      - name: Build the stack binaries
        # The server/website/installer-backend the stack images package, plus keycloak's roles input.
        # The client — the heavy render/wgpu compile — is built in the next step so the stack can boot
        # alongside it.
        run: just build
      - name: Bring up the full stack in the background
        # Booting the stack is mostly idle waiting on container healthchecks, so it overlaps the client
        # compile + lint + test below at no cost. It needs the host binaries the previous step built (the
        # images only package them), so it can't start before now; it waits for the infra prewarm so the
        # two don't build the same images twice, then signals its own sentinel. `just stack-up` runs no
        # cargo, so it never contends with the foreground compile for the target lock.
        run: |
          nohup bash -c '
            for _ in $(seq 1 180); do [ -f /tmp/prewarm.done ] && break; sleep 2; done
            just stack-up && touch /tmp/stack.done
          ' > /tmp/stack.log 2>&1 &
      - name: Build the client and e2e test, then lint and test
        # The CPU-bound foreground that the stack boot overlaps. Building the client and the e2e test
        # binary here (the heavy render compile, which the stack doesn't need) means the e2e step is pure
        # runtime, and fills this window to match the boot so it's fully hidden. Building before lint/test
        # lets them reuse these compiled deps instead of compiling Bevy again in a separate pass.
        run: |
          just e2e-build
          just lint
          just test
      - name: Wait for the full stack
        run: |
          for _ in $(seq 1 180); do [ -f /tmp/stack.done ] && break; sleep 2; done
          tail -n 50 /tmp/stack.log || true
          test -f /tmp/stack.done
      - name: Trust the stack's certificate authority
        # Caddy mints its own CA at first boot; the OS store covers the client/server binaries and
        # chrome keeps its own NSS store. The CA's location in the stack lives in `just ca-cert`.
        run: |
          just ca-cert /tmp/rift-root.crt
          sudo install -m 644 /tmp/rift-root.crt /usr/local/share/ca-certificates/rift-root.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d sql:"$HOME"/.pki/nssdb -N --empty-password 2>/dev/null || true
          certutil -d sql:"$HOME"/.pki/nssdb -A -t C,, -n rift-root -i /tmp/rift-root.crt
      - name: Start a virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 &
          for _ in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          DISPLAY=:99 openbox >/tmp/openbox.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Quiet chrome's first-run prompts
        # A fresh chrome profile pops first-run UI — the "set as default" bar and, by region, the EU
        # search-engine choice dialog — that covers the page and breaks the keyboard-driven sign-in.
        # A managed policy pre-picks the search provider and the wrapper flags suppress the rest. The
        # e2e drives chrome through $BROWSER.
        run: |
          sudo mkdir -p /etc/opt/chrome/policies/managed
          echo '{"DefaultSearchProviderEnabled":true,"DefaultSearchProviderName":"Google","DefaultSearchProviderKeyword":"google","DefaultSearchProviderSearchURL":"https://www.google.com/search?q={searchTerms}"}' \
            | sudo tee /etc/opt/chrome/policies/managed/no-choice.json >/dev/null
          printf '#!/bin/sh\nexec google-chrome --no-first-run --no-default-browser-check --disable-search-engine-choice-screen --disable-features=Translate "$@"\n' > /tmp/rift-chrome
          chmod +x /tmp/rift-chrome
      - name: E2E test
        env:
          BROWSER: /tmp/rift-chrome
        run: just e2e-run
      - name: Save E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: target/tmp/
      - name: Save stack logs
        if: failure()
        run: just logs > /tmp/stack.log 2>&1 || true
      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stack-logs
          path: /tmp/stack.log

      # --- main only: emit the Linux release + stack artifacts from the already-warm target ---
      - name: Build and stage the Linux release artifacts
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        # Shipped binaries are fully optimized — override the job's non-release opt-level. (This
        # recompiles the workspace at full opt; main only.) The player downloads only the installer
        # archive (binary + .env) and runs it; the installer fetches the client, the assets, and any
        # newer installer into the same folder. The client archive is binary-only: the installer carries
        # the one .env, so nothing collides. Assets are platform-independent, so the one archive is built
        # here on the Linux leg.
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
        run: |
          just build-client
          just build
          pkg="rift-linux-x86_64"
          inst="${INSTALLER_PREFIX}${pkg#rift-}"
          mkdir -p "stage/$pkg" "stage/$inst" out assets-out
          cp target/release/rift "stage/$pkg/rift"
          cp target/release/rift-installer "stage/$inst/rift-installer"
          just installer-env "${{ vars.RIFT_DOMAIN }}" rift > "stage/$inst/.env"
          tar czf "out/$pkg.tar.gz"  -C "stage/$pkg"  .
          tar czf "out/$inst.tar.gz" -C "stage/$inst" .
          zip -r "assets-out/${ASSETS_ZIP}" assets
      - name: Upload the Linux client and installer
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: client-linux
          path: out/
      - name: Upload the assets archive
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: assets-archive
          path: assets-out/
      - name: Upload the stack inputs for the deploy images
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: stack-linux
          path: |
            target/release/server
            target/release/website
            target/release/installer-backend
            docker/keycloak/roles.conf

  # main only: the remaining shipping platforms. Native runners, no cross-compilation. Gated behind a
  # green Linux job, so a red gate burns no macOS/Windows minutes and ships nothing untested.
  windows-macos:
    needs: linux
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - { os: macos-latest, asset: rift-macos-aarch64 }
          - { os: windows-latest, asset: rift-windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - name: Build the client and the installer
        run: just build-client
      - name: Package the client and the installer
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          pkg="${{ matrix.asset }}"
          inst="${INSTALLER_PREFIX}${pkg#rift-}"
          mkdir -p "stage/$pkg" "stage/$inst" out
          cp "target/release/rift$ext" "stage/$pkg/rift$ext"
          cp "target/release/rift-installer$ext" "stage/$inst/rift-installer$ext"
          just installer-env "${{ vars.RIFT_DOMAIN }}" "rift$ext" > "stage/$inst/.env"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "stage/$pkg"  && 7z a -tzip "../../out/$pkg.zip"  . >/dev/null)
            (cd "stage/$inst" && 7z a -tzip "../../out/$inst.zip" . >/dev/null)
          else
            tar czf "out/$pkg.tar.gz"  -C "stage/$pkg"  .
            tar czf "out/$inst.tar.gz" -C "stage/$inst" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.os }}
          path: out/

  release:
    needs: [linux, windows-macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # The workflow is the single source of truth for where downloads live: it derives these from the
    # release it just published, and the deploy job feeds them to the website and the installer backend.
    outputs:
      version: ${{ steps.publish.outputs.version }}
      per_platform_artifact_links: ${{ steps.publish.outputs.per_platform_artifact_links }}
      shared_artifact_links: ${{ steps.publish.outputs.shared_artifact_links }}
      installer_links: ${{ steps.publish.outputs.installer_links }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: client-*
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: assets-archive
          path: dist-assets
      - name: Publish the release and derive its download links
        id: publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # +100 keeps the version ahead of the tags the previous release workflow published (its run
          # counter reached the mid-20s before this workflow's counter restarted at 1), so releases
          # never collide with — nor rank below — the live one.
          version="0.$(( ${{ github.run_number }} + 100 ))"
          gh release create "$version" dist/client-*/rift-* "dist-assets/${ASSETS_ZIP}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$version" \
            --notes "Automated release of ${{ github.sha }}."
          # Read the asset URLs back and organize them as the installer backend serves them: a
          # per-platform map (keyed by {os}-{arch}, derived from the installer asset names) plus the
          # shared assets, alongside the per-OS installers the downloads page lists. The map is JSON,
          # which can't survive interpolation into a shell command, so it leaves here base64-encoded.
          assets=$(gh release view "$version" --repo "${{ github.repository }}" --json assets)
          per_platform=$(jq -c --arg z "$ASSETS_ZIP" --arg p "$INSTALLER_PREFIX" '
            (.assets) as $a
            | [$a[].name | select(startswith($p)) | ltrimstr($p) | sub("\\.(tar\\.gz|zip)$"; "")] as $platforms
            | reduce $platforms[] as $plat ({};
                .[$plat] = [$a[] | select(.name != $z and (.name | contains($plat))) | .url])
          ' <<<"$assets")
          {
            echo "version=$version"
            echo "per_platform_artifact_links=$(printf %s "$per_platform" | base64 -w0)"
            echo "shared_artifact_links=$(jq -r --arg z "$ASSETS_ZIP" '[.assets[] | select(.name == $z) | .url] | join(",")' <<<"$assets")"
            echo "installer_links=$(jq -r --arg p "$INSTALLER_PREFIX" '[.assets[] | select(.name | startswith($p)) | .url] | join(",")' <<<"$assets")"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: [linux, release]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_REGISTRY: ghcr.io
      DOCKER_USERNAME: ${{ github.repository_owner }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_REGISTRY_URL: ghcr.io/${{ github.repository_owner }}
      DOCKER_IMAGE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          deps: none
      - uses: actions/download-artifact@v7
        with:
          name: stack-linux
          path: .
      - name: Restore the executable bits artifact transport may drop
        run: chmod +x target/release/server target/release/website target/release/installer-backend
      - name: Build and push the stack images
        run: |
          echo "${{ env.DOCKER_PASSWORD }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
          just push-images

      - name: Upload docker runtime dependencies
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: docker/
          remote_path: ~/docker
          remote_host: ${{ secrets.PROD_SSH_HOST }}
          remote_user: ${{ secrets.PROD_SSH_USERNAME }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy via SSH action
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        continue-on-error: true
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/docker

            # Set production host env vars; compose reads .env for interpolation and layering.
            echo "COMPOSE_ENV=prod" > .env
            echo "DOCKER_REGISTRY_URL=\"${{ env.DOCKER_REGISTRY_URL }}\"" >> .env
            echo "DOCKER_IMAGE_VERSION=\"${{ env.DOCKER_IMAGE_VERSION }}\"" >> .env
            echo "RIFT_DOMAIN=\"${{ vars.RIFT_DOMAIN }}\"" >> .env
            echo "RIFT_INSTALLER_LINKS=\"${{ needs.release.outputs.installer_links }}\"" >> .env
            echo "RIFT_INSTALLER_SHARED_ARTIFACT_LINKS=\"${{ needs.release.outputs.shared_artifact_links }}\"" >> .env
            printf 'RIFT_INSTALLER_PER_PLATFORM_ARTIFACT_LINKS=%s\n' "$(echo '${{ needs.release.outputs.per_platform_artifact_links }}' | base64 -d)" >> .env
            echo "RIFT_VERSION=\"${{ needs.release.outputs.version }}\"" >> .env

            echo ${{ env.DOCKER_PASSWORD }} | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
            docker network inspect rift >/dev/null 2>&1 || docker network create rift
            docker compose --profile prod pull
            docker compose --profile prod down

            if ! docker compose --profile prod up -d --remove-orphans --no-build; then
              echo "🚨 docker-compose up failed — gathering all container logs"
              mkdir -p logs
              for id in $(docker ps -aq); do
                name=$(docker inspect --format='{{.Name}}' "$id" | sed 's#^/##')
                docker logs "$id" &> "logs/${name}.log" || true
              done
              tar czf deploy-failure-logs.tar.gz logs/
              exit 1
            fi

            docker image prune

      - name: Download deployment logs from server
        if: steps.deploy.outcome == 'failure'
        uses: nicklasfrahm/scp-action@main
        with:
          direction: download
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: ~/docker/deploy-failure-logs.tar.gz
          target: ./deploy-failure-logs.tar.gz
          insecure_ignore_fingerprint: true

      - name: Save deployment logs
        if: steps.deploy.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: deploy-failure-logs
          path: ./deploy-failure-logs.tar.gz

      - name: Fail workflow on deploy error
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "🚨 Deployment failed — see deploy-failure-logs artifact for details."
          exit 1
