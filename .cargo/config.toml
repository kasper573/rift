# crates.io downloads flake over HTTP/2 ("error in the HTTP2 framing layer"); force HTTP/1.1 and
# retry hard so a cold cache doesn't fail a build on a transient blip. Applies to every build —
# local and CI — instead of being restated in each workflow's env block.
[net]
retry = 10

[http]
multiplexing = false

# `rift profile` walks the server's stacks by frame pointer. Every Linux build keeps them, so the
# profiling server shares the release build rather than compiling every crate again with flags of its
# own; keeping them costs the binaries no measurable speed.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "force-frame-pointers=yes"]
