[package]
name = "cli"
version.workspace = true
edition.workspace = true
description = "The `rift` command: checks, renders, benches, load tests and profiles a game"

[[bin]]
name = "rift"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
testkit = { path = "../testkit" }
service = { path = "../service" }
bevy.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_replicon = { workspace = true, features = ["client", "server"] }
bevy_replicon_renet2.workspace = true
bevy_state.workspace = true
bevy_time = { workspace = true, features = ["std"] }
clap.workspace = true
renet2.workspace = true
schemars = "1"
serde.workspace = true
serde_json.workspace = true
strum = { workspace = true, features = ["derive"] }
tempfile = "3"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
ureq = { workspace = true, features = ["rustls", "platform-verifier"] }
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
walkdir = "2"

[lints]
workspace = true
