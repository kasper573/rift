[package]
name = "cli"
version.workspace = true
edition.workspace = true
description = "The `rift` command: checks, renders, benches, load tests and profiles a game"

[[bin]]
name = "rift"
path = "src/main.rs"

[dependencies]
rayon = { workspace = true }
engine = { path = "../engine" }
editor = { path = "../editor" }
testkit = { path = "../testkit" }
service = { path = "../service" }
bevy.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_replication.workspace = true
bevy_time = { workspace = true, features = ["std"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
strum = { workspace = true, features = ["derive"] }
tempfile.workspace = true
ureq = { workspace = true, features = ["rustls", "platform-verifier"] }
sysinfo.workspace = true
walkdir.workspace = true
noise.workspace = true

[lints]
workspace = true
