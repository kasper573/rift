[package]
name = "tiled"
version.workspace = true
edition.workspace = true
description = "Minimal Tiled JSON loader (orthogonal): tile layers (base64 + zlib/gzip/deflate), object layers, tilesets — plus gid-to-region resolution and tile animation for renderers."

[dependencies]
image = { path = "../image" }
# Pixels/Tiles units and Pos/Size/Rect geometry.
math = { path = "../math" }
# Tiled compresses tile-layer payloads with zlib/gzip; flate2's default
# (pure-Rust miniz_oxide) backend keeps us dependency-light. Base64 is small
# enough to hand-roll (see `b64`), so it needs no crate.
flate2 = "1"
serde.workspace = true
serde_json.workspace = true
