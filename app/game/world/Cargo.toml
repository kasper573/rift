[package]
name = "world"
version.workspace = true
edition.workspace = true
description = "The MMORPG game library: wire protocol, content tables, and world simulation (NPC AI, combat, movement, portals) — organized by domain. The server and client are thin composition roots over this."

[dependencies]
include_dir = "0.7"
rift = { path = "../../../lib/rift", default-features = false }
math = { path = "../../../lib/math" }
tiled = { version = "0.15", default-features = false }
nav = { path = "../../../lib/nav" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
