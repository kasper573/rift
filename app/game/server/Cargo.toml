[package]
name = "server"
version.workspace = true
edition.workspace = true
description = "Authoritative MMORPG server binary: binds TCP and runs the `world` simulation at a fixed tick."

[dependencies]
world = { path = "../world" }
rift = { path = "../../../lib/rift" }
auth = { path = "../../../lib/auth" }

# The build script runs world::validate over the embedded assets, so broken
# content fails the server build instead of the running server.
[build-dependencies]
world = { path = "../world" }
