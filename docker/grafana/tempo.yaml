multitenancy_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:

ingester:
  trace_idle_period: "10s"
  max_block_bytes: 1_000_000
  max_block_duration: "5m"

compactor:
  compaction:
    compaction_window: "1h"
    max_block_bytes: 100_000_000
    block_retention: "24h"
    compacted_block_retention: "10m"

metrics_generator:
  registry:
    external_labels:
      source: "tempo"
      cluster: "rift"
  storage:
    path: "/var/tempo/generator/wal"
    remote_write:
      - url: "${MIMIR_BASE}/api/v1/push"
        send_exemplars: true

storage:
  trace:
    backend: "local"
    block:
      bloom_filter_false_positive: .05
      v2_index_downsample_bytes: 1000
      v2_encoding: "zstd"
    wal:
      path: "/var/tempo/wal"
      v2_encoding: "snappy"
    local:
      path: "/var/tempo/blocks"
    pool:
      max_workers: 100
      queue_depth: 10000

overrides:
  metrics_generator_processors:
    - "service-graphs"
    - "span-metrics"
