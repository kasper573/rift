[Definition]
# Caddy json access logs. A burst of denied or rate-limited requests from one ip is an attack;
# legitimate clients produce these rarely. Keycloak password failures are not visible here (they
# return 200 pages) — the realm's own brute force protection covers those.
failregex = ^.*"client_ip":"<HOST>".*?"status":(?:401|403|429)[,}].*$
