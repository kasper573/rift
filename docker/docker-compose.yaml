# The project name predates the repo rename; it keeps existing volume names (prod data) valid.
name: docker

networks:
  default:
    name: rift
    external: true

# Defaults to the test env; prod pins COMPOSE_ENV=prod in the .env its deploy writes.
x-env-files: &env_files
  - path: .env
    required: false
  - .env.${COMPOSE_ENV:-test}
  - .env.shared

x-logging: &logging
  driver: json-file
  options:
    # Used by alloy to produce labels for Loki
    tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

services:
  rift-website:
    env_file: *env_files
    logging: *logging
    build:
      dockerfile: ./docker/Dockerfile
      context: ..
      target: website
    image: ${DOCKER_REGISTRY_URL:-rift}/rift-website:${DOCKER_IMAGE_VERSION:-latest}
    restart: always
    profiles: ["prod", "test"]
    depends_on:
      - rift-game-server

  rift-installer:
    env_file: *env_files
    logging: *logging
    build:
      dockerfile: ./docker/Dockerfile
      context: ..
      target: installer-backend
    image: ${DOCKER_REGISTRY_URL:-rift}/rift-installer:${DOCKER_IMAGE_VERSION:-latest}
    restart: always
    profiles: ["prod", "test"]

  rift-game-server:
    env_file: *env_files
    logging: *logging
    build:
      dockerfile: ./docker/Dockerfile
      context: ..
      target: game-server
    image: ${DOCKER_REGISTRY_URL:-rift}/rift-game-server:${DOCKER_IMAGE_VERSION:-latest}
    restart: always
    profiles: ["prod", "test"]
    # The encrypted netcode transport; clients dial it directly (Caddy only proxies the HTTP API).
    ports:
      - "9998:9998/udp"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$RIFT_GAME_SERVER_PORT/health"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      keycloak-healthcheck:
        condition: service_healthy

  keycloak:
    env_file: *env_files
    logging: *logging
    build:
      dockerfile: ./Dockerfile.keycloak
      context: .
    image: ${DOCKER_REGISTRY_URL:-rift}/rift-keycloak:${DOCKER_IMAGE_VERSION:-latest}
    command: start --optimized --import-realm
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  # the keycloak image doesn't have curl so we healthcheck it externally
  keycloak-healthcheck:
    env_file: *env_files
    logging: *logging
    image: curlimages/curl
    command: ["sh", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://$$KEYCLOAK_MGMT_TARGET/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20

  postgres:
    env_file: *env_files
    logging: *logging
    image: postgres:16.4
    restart: always
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh
      # A named volume (not a host bind) so each stack owns its data and `down -v` resets it.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -d $$POSTGRES_INFRA_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  mimir:
    env_file: *env_files
    logging: *logging
    image: grafana/mimir:2.15.2
    volumes:
      - ./grafana/mimir.yaml:/etc/mimir/config.yaml
      - mimir-data:/data
    entrypoint: ["/bin/mimir", "-config.file=/etc/mimir/config.yaml"]

  tempo:
    env_file: *env_files
    logging: *logging
    image: grafana/tempo:2.6.1
    volumes:
      - ./grafana/tempo.yaml:/etc/tempo-config/tempo.yaml
      - tempo-data:/var/tempo
    command:
      - -config.file=/etc/tempo-config/tempo.yaml
      - -config.expand-env=true

  pyroscope:
    env_file: *env_files
    logging: *logging
    image: grafana/pyroscope:1.21.1
    volumes:
      - pyroscope-data:/data

  alloy:
    env_file: *env_files
    logging: *logging
    image: grafana/alloy:v1.8.3
    volumes:
      - ./grafana/alloy.alloy:/etc/alloy/config.alloy
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - /tmp:/tmp
    entrypoint:
      - "/bin/alloy"
      - "run"
      - '--config.extra-args="-config.expand-env"'
      - /etc/alloy/config.alloy
    depends_on:
      - mimir
      - grafana
      - loki
      - tempo

  loki:
    logging: *logging
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./grafana/loki.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki

  node_exporter:
    env_file: *env_files
    logging: *logging
    image: prom/node-exporter:v1.8.2

  postgres_exporter:
    env_file: *env_files
    logging: *logging
    image: prometheuscommunity/postgres-exporter:v0.18.1
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
    depends_on:
      - postgres

  grafana:
    env_file: *env_files
    logging: *logging
    image: grafana/grafana:11.6.1
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards

  reverse-proxy:
    env_file: *env_files
    environment:
      OTEL_SERVICE_NAME: reverse-proxy
    logging: *logging
    build:
      dockerfile: ./Dockerfile.reverse-proxy
      context: .
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    image: ${DOCKER_REGISTRY_URL:-rift}/rift-reverse-proxy:${DOCKER_IMAGE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile
      - reverse-proxy-data:/data
      - reverse-proxy-config:/config
      - caddy-logs:/var/log/caddy

  postfix:
    env_file: *env_files
    logging: *logging
    image: boky/postfix:v4.3.0
    restart: always

  # Bans abusive ips at the host firewall, fed by caddy's access log (the stack's public edge)
  # and the host's sshd log. Host networking + NET_ADMIN because bans are iptables rules.
  fail2ban:
    logging: *logging
    image: crazymax/fail2ban:1.1.0
    restart: always
    profiles: ["prod"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - fail2ban-data:/data
      - ./fail2ban/jail.d:/data/jail.d:ro
      - ./fail2ban/filter.d:/data/filter.d:ro
      - caddy-logs:/var/log/caddy:ro
      - /var/log/auth.log:/var/log/auth.log:ro

volumes:
  caddy-logs:
  fail2ban-data:
  grafana-data:
  loki-data:
  mimir-data:
  postgres-data:
  pyroscope-data:
  reverse-proxy-data:
  reverse-proxy-config:
  tempo-data:
