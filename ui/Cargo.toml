[package]
name = "ui"
version.workspace = true
edition.workspace = true
description = "A small retained-mode UI component library over bevy_ui: Radix-inspired components with declarative styling, theming, motion, and collision-aware floating overlays."
repository = "https://github.com/kasper573/rift"
authors = ["kasper573"]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_ui = { workspace = true }
bevy_ui_widgets = { workspace = true }
bevy_picking = { workspace = true }
bevy_input = { workspace = true }
bevy_asset = { workspace = true }
bevy_camera = { workspace = true }
bevy_color = { workspace = true }
bevy_text = { workspace = true }
bevy_window = { workspace = true }
bevy_math = { workspace = true }
bevy_time = { workspace = true }
bevy_scene = { workspace = true }
bevy_opacity = { path = "../bevy_opacity" }
# The `gallery` binary (a standalone showcase window) needs the full Bevy app — windowing, rendering,
# winit — which the library half (built on the individual `bevy_*` crates above) does not.
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_winit",
    "x11",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_asset",
    "bevy_image",
    "png",
    "bevy_color",
    "bevy_text",
    "default_font",
    "bevy_input_focus",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_picking",
    "ui_picking",
] }

[dev-dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_ui = { workspace = true }
bevy_ui_widgets = { workspace = true }
bevy_picking = { workspace = true }
bevy_color = { workspace = true }
bevy_text = { workspace = true }
bevy_window = { workspace = true }
bevy_math = { workspace = true }
bevy_time = { workspace = true }
