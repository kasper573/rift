[package]
name = "editor"
version.workspace = true
edition.workspace = true
description = "The content editor: opens a content folder, edits it through the engine's loader and writer, and play-tests it with the engine's own binaries"

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
ui = { path = "../ui" }
bevy = { workspace = true, features = ["x11", "multi_threaded"] }
bevy_egui.workspace = true
bevy_replication.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1"
strum = { workspace = true }
strip-ansi-escapes = "0.2"
opener = "0.9"
blake3 = "1"
notify = "8"
rfd = "0.17"
process-wrap = { version = "10", features = ["std"] }
include_dir = "0.7"
image = { workspace = true, features = ["gif"] }
dirs = "7"
ureq = { workspace = true }
rayon.workspace = true
base64 = "0.23"
walkdir.workspace = true
imbl = "7"
quick_cache = "0.7"
jwalk = "0.9"
clap.workspace = true
jiff = "0.2"
ufbx = "0.11.5"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }

[dev-dependencies]
testkit = { path = "../testkit" }
tempfile.workspace = true

[lints]
workspace = true
