[package]
name = "editor"
version.workspace = true
edition.workspace = true
description = "The content editor: opens a content folder, edits it through the engine's loader and writer, and play-tests it with the engine's own binaries"

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
ui = { path = "../ui" }
bevy = { workspace = true, features = ["x11", "multi_threaded"] }
bevy_egui.workspace = true
bevy_replicon = { workspace = true, features = ["server"] }
serde.workspace = true
serde_json.workspace = true
schemars = "1"
strum = { workspace = true }
strip-ansi-escapes = "0.2"
opener = "0.9"
blake3 = "1"
notify = "8"
rfd = "0.17"
process-wrap = { version = "10", features = ["std"] }
include_dir = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
png = "0.18"
dirs = "7"
ureq = { workspace = true }
rayon.workspace = true
base64 = "0.23"
walkdir = "2"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2"

[dev-dependencies]
testkit = { path = "../testkit" }
tempfile = "3"

[lints]
workspace = true
