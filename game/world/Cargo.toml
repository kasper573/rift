[package]
name = "world"
version.workspace = true
edition.workspace = true
description = "The MMORPG game library: the isomorphic core both server and client share — the wire protocol (replicated components + messages), content tables, and the game-agnostic substrate — organized by feature. The authoritative simulation is in the `server` crate, the client view in `client`."

[[bin]]
name = "kc-roles"
path = "src/bin/kc_roles.rs"

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_replicon = { workspace = true, features = ["client"] }
derive_more = { version = "2", features = ["add", "add_assign"] }
euclid = { version = "0.22", features = ["serde"] }
include_dir = "0.7"
pathfinding = "4"
renet2.workspace = true
serde.workspace = true
serde_json.workspace = true
tiled = { version = "0.15", default-features = false }
