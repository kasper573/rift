[package]
name = "world"
version.workspace = true
edition.workspace = true
description = "The game, headless and isomophic: contains no frontend and backend specific concerns"

[package.metadata.lint]
game = true

[[bin]]
name = "kc-roles"
path = "src/bin/kc_roles.rs"

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_replicon = { workspace = true, features = ["client", "server"] }
bevy_state.workspace = true
bevy_time = { workspace = true, features = ["std"] }
derive_more = { version = "2", features = ["add", "add_assign"] }
euclid = { version = "0.22", features = ["serde"] }
pathfinding = "4"
oorandom = "11"
getrandom = "0.2"
strum = { workspace = true, features = ["derive"] }
renet2.workspace = true
serde.workspace = true
serde_json.workspace = true
tiled = { version = "0.15", default-features = false }
postcard = { version = "1", features = ["alloc"] }

# Native-only: the area worlds are stepped in parallel by the server/bench drivers. The wasm client
# steps a single world and never links rayon (its thread pool has no wasm backend).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true
