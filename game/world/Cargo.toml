[package]
name = "world"
version.workspace = true
edition.workspace = true
description = "The MMORPG game library: the wire protocol, content tables, and the authoritative server-side systems (NPC AI, combat, movement, portals) — organized by domain. The server and client are thin composition roots over this."

[features]
default = ["systems"]
systems = ["bevy_replicon/server", "dep:bevy_time"]

[[bin]]
name = "kc-roles"
path = "src/bin/kc_roles.rs"

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_replicon = { workspace = true, features = ["client"] }
bevy_state.workspace = true
bevy_time = { workspace = true, features = ["std"], optional = true }
derive_more = { version = "2", features = ["add", "add_assign"] }
euclid = { version = "0.22", features = ["serde"] }
include_dir = "0.7"
pathfinding = "4"
renet2.workspace = true
serde.workspace = true
serde_json.workspace = true
tiled = { version = "0.15", default-features = false }
