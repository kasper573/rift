[package]
name = "client"
version.workspace = true
edition.workspace = true
description = "Playable MMORPG client: a Bevy app rendering the replicated `world` over netcode, with a bevy_ui HUD and browser SSO."
repository = "https://github.com/kasper573/rift"
authors = ["kasper573"]

[package.metadata.wix]
upgrade-guid = "66EB3533-08AB-4086-8389-13FD7D3CBAB1"
path-guid = "172E55AD-414D-488C-8857-829BE2454952"
license = false
eula = false

[[bin]]
name = "rift"
path = "src/main.rs"

[features]
# The `dx serve --hot-patch` dev loop: live system patching (subsecond) plus asset hot-reload.
hotpatch = ["bevy/hotpatching", "bevy/file_watcher"]
# Release/dist builds: embed the assets tree so the shipped binary is self-contained.
dist = ["dep:include_dir", "dep:futures-lite"]

[dependencies]
world = { path = "../world", default-features = false }
include_dir = { version = "0.7", optional = true }
futures-lite = { version = "2", optional = true }
# Bevy's `2d` + `ui` feature bundles, minus `bevy_gilrs` (drops the `libudev` build dependency —
# no gamepad in a mouse/keyboard MMO) and `wayland` (drops the `libwayland-dev` build dependency;
# `x11` is dlopen-only and runs on X11 and Wayland-via-XWayland).
bevy = { version = "0.19.0-rc.3", default-features = false, features = [
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "reflect_auto_register",
    "std",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "x11",
    "custom_cursor",
    "sysinfo_plugin",
    "bevy_sprite",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_sprite_render",
    "bevy_gizmos_render",
    "bevy_animation",
    "bevy_camera",
    "bevy_color",
    "bevy_gizmos",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_text",
    "bevy_window",
    "hdr",
    "png",
    "bevy_input_focus",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_picking",
    "sprite_picking",
    "ui_picking",
] }
bevy_replicon = { workspace = true, features = ["client"] }
bevy_replicon_renet = { workspace = true, features = ["client", "renet_netcode"] }
bevy_kira_audio = { version = "0.26.0-rc.1", features = ["wav"] }
openidconnect = { version = "4", features = ["ureq"] }
http = "1"
ureq = { workspace = true, features = ["rustls", "platform-verifier", "json"] }
webbrowser = "1"
base64 = "0.22"
dirs = "6"
serde = { workspace = true }
serde_json = { workspace = true }

# The E2E test drives the real client binary on its own X display and asserts on screenshots.
[dev-dependencies]
png = "0.18"
ureq = { workspace = true, features = ["rustls", "json"] }
x11rb = { version = "0.13", features = ["xtest"] }
