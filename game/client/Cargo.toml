[package]
name = "client"
version.workspace = true
edition.workspace = true
description = "Frontend for the game"
repository = "https://github.com/kasper573/rift"
authors = ["kasper573"]

[package.metadata.lint]
game = true

# A wasm `cdylib` whose exported `run` the page's loader calls; `rlib` keeps it usable from tests.
[lib]
name = "rift"
crate-type = ["cdylib", "rlib"]

[dependencies]
world = { path = "../world" }
ui = { path = "../../ui" }
# Bevy's `2d` + `ui` feature bundles for the browser: `webgl2` (far more reliable than `webgpu` under
# headless Chrome for e2e) and `web` for the browser platform integration. No `x11`/`multi_threaded`/
# `sysinfo_plugin` — those are native-only and wasm is single-threaded.
bevy = { workspace = true, features = [
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "reflect_auto_register",
    "std",
    "bevy_winit",
    "default_font",
    "custom_cursor",
    "bevy_sprite",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_sprite_render",
    "bevy_gizmos_render",
    "bevy_animation",
    "bevy_camera",
    "bevy_color",
    "bevy_gizmos",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_text",
    "bevy_window",
    "hdr",
    "png",
    "bevy_input_focus",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_picking",
    "sprite_picking",
    "ui_picking",
    "webgl2",
    "web",
] }
bevy_picking = { workspace = true }
bevy_replicon = { workspace = true, features = ["client"] }
renet2 = { workspace = true }
renet2_netcode = { workspace = true, features = ["ws_client_transport"] }
bevy_kira_audio = { version = "0.26.0-rc.1", features = ["wav"] }
base64 = "0.22"
enum_dispatch = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
gloo-net = { version = "0.6", default-features = false, features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Storage",
] }
include_dir = "0.7"
console_error_panic_hook = "0.1"
web-time = "1"
url = "2"
# renetcode2's session encryption needs entropy; route getrandom to the browser's crypto on wasm.
getrandom = { version = "0.2", features = ["js"] }
