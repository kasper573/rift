[package]
name = "e2e"
version.workspace = true
edition.workspace = true
description = "Cross-platform end-to-end test: drives the shipped client against a live server on a real display and asserts on the pixels it renders."
publish = false

[lib]
path = "src/lib.rs"

# One platform-agnostic path: `enigo` feeds the client genuine OS input, `xcap` finds its window by
# title and captures it, ureq polls the server's health endpoint. The client and server binaries are
# located by env var (the CI passes the release builds), so this crate never compiles them. Standing
# up the display the test drives is the pipeline's job; nothing here is OS-specific. This crate is
# excluded from the workspace `default-members`, so a plain `cargo build`/`test` skips it (xcap pulls
# heavy capture deps); build it via `just e2e`.
[dev-dependencies]
enigo = "0.6"
png = "0.18"
ureq = { workspace = true, features = ["rustls", "json"] }
xcap = "0.9"
