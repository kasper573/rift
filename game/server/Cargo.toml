[package]
name = "server"
version.workspace = true
edition.workspace = true
description = "Authoritative MMORPG server binary: mints session tokens and runs the `world` simulation over an encrypted UDP netcode transport at a fixed tick."

[dependencies]
axum.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_replicon = { workspace = true, features = ["server"] }
bevy_replicon_renet = { workspace = true, features = ["server", "renet_netcode"] }
bevy_state.workspace = true
ctrlc.workspace = true
envy.workspace = true
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
metrics = "0.24"
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
service = { path = "../../service" }
tokio.workspace = true
ureq = { workspace = true, features = ["rustls", "platform-verifier"] }
world = { path = "../world" }
