[package]
name = "server"
version.workspace = true
edition.workspace = true
description = "Authoritative MMORPG server binary: terminates WebSockets and runs the `world` simulation at a fixed tick."

[features]
stack = []

[[test]]
name = "browser"
path = "tests/browser/main.rs"
required-features = ["stack"]

[dependencies]
axum = { workspace = true, features = ["ws"] }
envy.workspace = true
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
metrics-process.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ureq.workspace = true
world = { path = "../world" }

[dev-dependencies]
base64 = "0.22"
headless_chrome = { version = "1", features = ["offline"] }
serde_json.workspace = true
ureq = { workspace = true, features = ["rustls", "json"] }
