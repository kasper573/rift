[package]
name = "server"
version.workspace = true
edition.workspace = true
description = "The authoritative MMORPG server: the world simulation (combat, movement, NPC AI, items, portals) as a library over the isomorphic `world` crate, plus the binary that mints session tokens and runs it over an encrypted WebSocket netcode transport at a fixed tick."

[dependencies]
axum.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_replicon = { workspace = true, features = ["server"] }
bevy_time = { workspace = true, features = ["std"] }
renet2.workspace = true
renet2_netcode = { workspace = true, features = ["ws_server_transport"] }
bevy_state.workspace = true
ctrlc.workspace = true
envy.workspace = true
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
metrics = "0.24"
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
service = { path = "../../service" }
tokio.workspace = true
ureq = { workspace = true, features = ["rustls", "platform-verifier"] }
world = { path = "../world" }
