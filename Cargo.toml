[workspace]
resolver = "3"
members = [
    "ui",
    "bevy/replication",
    "bevy/terminal",
    "engine",
    "game-server",
    "lint",
    "testkit",
    "editor",
    "cli",
    "oidc",
    "service",
    "web-server",
    "smoke",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
match_bool = "warn"

[workspace.dependencies]
askama = "0.16"
clap = { version = "4.6.7", features = ["derive"] }
axum-prometheus = "0.10"
ctrlc = { version = "3", features = ["termination"] }
tikv-jemallocator = { version = "0.7", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
jemalloc_pprof = { version = "0.9", features = ["symbolize"] }
bevy_app = { version = "0.20.0", default-features = false }
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std", "serialize"] }
bevy_platform = { version = "0.20.0", default-features = false, features = ["std"] }
slotmap = "1.1"
smallvec = "1.16"
bevy_input = { version = "0.20.0", default-features = false }
bevy_math = { version = "0.20.0", default-features = false }
bevy_time = { version = "0.20.0", default-features = false }
bevy = { version = "0.20.0", default-features = false }
# Only to enable what bevy leaves off; the version must be the one bevy renders with.
wgpu = { version = "30.0.1", default-features = false }
syn = { version = "3", features = ["full"] }
proc-macro2 = "1"
renet2 = { version = "1", default-features = false }
renet2_netcode = { version = "1", default-features = false, features = ["native_transport"] }
rayon = "1"
thread-priority = "3"
arc-swap = "1"
bevy_replication = { path = "bevy/replication" }
postcard = { version = "1", features = ["alloc"] }
egui = "0.36"
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
axum = "0.8"
envy = "0.4"
metrics-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
strum = { version = "0.28" }
strsim = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.7", features = ["normalize-path"] }
ureq = { version = "3", default-features = false }
serde_urlencoded = "0.7"
tempfile = "3"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
oauth2-test-server = "0.2.3"
openidconnect = "4"

[profile.release]
lto = false
incremental = true

# Release with the symbols and line tables a sampling profiler reads; full debug info would make
# the binary too large to publish.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
