[workspace]
resolver = "3"
members = [
    "game/world",
    "game/server",
    "game/client",
    "website",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
askama = "0.14"
bevy_app = { version = "0.18", default-features = false }
bevy_ecs = { version = "0.18", default-features = false, features = ["std", "serialize"] }
bevy_replicon = { version = "0.40", default-features = false }
bevy_state = { version = "0.18", default-features = false, features = ["bevy_app"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tungstenite = "0.29"
ureq = { version = "3", default-features = false }

# LTO + a single codegen unit were traded away to keep CI/image builds fast (and cacheable);
# re-enable them for deploy-grade optimization once runtime performance matters.
[profile.release]
lto = false
