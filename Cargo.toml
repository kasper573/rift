[workspace]
resolver = "3"
members = [
    "ui",
    "bevy/tiled",
    "bevy/terminal",
    "bevy/terminal/macros",
    "game/world",
    "game/server",
    "game/client",
    "game/bench",
    "game/lint",
    "service",
    "website",
]
# bevy/tiled is a workspace member but excluded from the default build: its bench bin
# would otherwise collide with the bench bin in game/bench (shared target dir).
default-members = [
    "ui",
    "bevy/terminal",
    "bevy/terminal/macros",
    "game/world",
    "game/server",
    "game/bench",
    "game/lint",
    "service",
    "website",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
askama = "0.14"
axum-prometheus = "0.10"
inventory = "0.3"
typetag = "0.2"
ctrlc = { version = "3", features = ["termination"] }
pyroscope = { version = "2", features = ["backend-pprof-rs"] }
tikv-jemallocator = { version = "0.6", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
jemalloc_pprof = { version = "0.8", features = ["symbolize"] }
bevy_app = { version = "0.19.0", default-features = false }
bevy_ecs = { version = "0.19.0", default-features = false, features = ["std", "serialize"] }
bevy_ui = { version = "0.19.0", default-features = false, features = ["bevy_picking"] }
bevy_ui_widgets = { version = "0.19.0", default-features = false }
bevy_picking = { version = "0.19.0", default-features = false }
bevy_input = { version = "0.19.0", default-features = false }
bevy_input_focus = { version = "0.19.0" }
bevy_asset = { version = "0.19.0", default-features = false }
bevy_color = { version = "0.19.0", default-features = false }
bevy_text = { version = "0.19.0", default-features = false }
bevy_window = { version = "0.19.0", default-features = false }
bevy_math = { version = "0.19.0", default-features = false }
bevy_time = { version = "0.19.0", default-features = false }
bevy_camera = "0.19.0"
bevy_scene = { version = "0.19.0", default-features = false }
bevy = { version = "0.19.0", default-features = false }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
bevy_replicon = { version = "0.41.0-rc.1", default-features = false }
renet2 = { version = "0.15", default-features = false }
rayon = "1"
bevy_state = { version = "0.19.0", default-features = false, features = ["bevy_app"] }
axum = "0.8"
envy = "0.4"
metrics-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
ureq = { version = "3", default-features = false }

[profile.release]
lto = false
incremental = true

# Release with debug symbols, for sampling profilers (e.g. `bench --features profiling`).
[profile.profiling]
inherits = "release"
debug = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
