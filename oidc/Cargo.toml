[package]
name = "oidc"
version.workspace = true
edition.workspace = true
description = "Sign-in through any OpenID Connect provider: checking its access tokens, and signing a native app's user in through the system browser"

[dependencies]
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
oauth2 = { version = "5", default-features = false }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
tiny_http = "0.12"
ureq = { workspace = true, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
oauth2-test-server = "0.2.3"
# The provider signs with keys of this version's types, so the tests sign tokens of their own with it.
provider-jwt = { package = "jsonwebtoken", version = "10" }
tokio.workspace = true

[lints]
workspace = true
