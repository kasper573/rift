[package]
name = "bevy_view"
version.workspace = true
edition.workspace = true
description = "Declarative, immediate-mode UI over retained bevy_ui: a `view!` JSX macro plus a reconciler that diffs a View tree into UI entities each frame."
repository = "https://github.com/kasper573/rift"
authors = ["kasper573"]

[dependencies]
bevy_view_macro = { path = "macro" }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_ui = { workspace = true }
bevy_picking = { workspace = true }
bevy_window = { workspace = true }
bevy_math = { workspace = true }

[dev-dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_ui = { workspace = true }
bevy_picking = { workspace = true }
bevy_window = { workspace = true }
bevy_math = { workspace = true }
