[package]
name = "engine"
version.workspace = true
edition.workspace = true
description = "The engine: the simulation library and its desktop client"

[[bin]]
name = "desktop-client"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = [
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "reflect_auto_register",
    "std",
    "bevy_winit",
    "default_font",
    "custom_cursor",
    "bevy_sprite",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_sprite_render",
    "bevy_gizmos_render",
    "bevy_animation",
    "bevy_pbr",
    "bevy_light",
    "bevy_anti_alias",
    "smaa_luts",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
    "experimental_pbr_pcss",
    "pbr_light_textures",
    "bevy_gltf",
    "bevy_scene",
    "gltf_animation",
    "bevy_camera",
    "bevy_color",
    "bevy_gizmos",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_text",
    "bevy_window",
    "hdr",
    "x11",
] }
ui = { path = "../ui" }
bevy_terminal = { path = "../bevy/terminal" }
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_platform.workspace = true
slotmap.workspace = true
smallvec.workspace = true
bevy_egui.workspace = true
accesskit = "0.24"
bevy_replication.workspace = true
bevy_time = { workspace = true, features = ["std"] }
bevy_input = { workspace = true, features = ["serialize"] }
bevy_math = { workspace = true, features = ["serialize"] }
bevy_kira_audio = { version = "0.27", default-features = false }
# bevy_kira_audio fails to build without kira's symphonia feature, which otherwise only its own audio
# loaders turn on.
kira = { version = "0.12", default-features = false, features = ["symphonia"] }
base64 = "0.23"
symphonia = { version = "0.6", default-features = false, features = ["flac", "wav", "pcm"] }
futures-timer = "3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
derive_more = { version = "2", features = ["add", "add_assign"] }
euclid = { version = "0.22", features = ["serde"] }
oorandom = "11"
getrandom = "0.4"
num_cpus = "1"
rayon.workspace = true
strum = { workspace = true, features = ["derive"] }
strsim.workspace = true
renet2.workspace = true
renet2_netcode.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
envy.workspace = true
dotenvy = "0.15"
jsonc-parser = "0.34"
blake3 = "1"
schemars = "1"
naga = { version = "30", features = ["wgsl-in"] }
png = "0.18"
tar = "0.4"
flate2 = "1"
postcard.workspace = true
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
polyanya = "0.17"
glam = "0.32"
bevy_skeleton_modifiers = { version = "0.1.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { workspace = true, features = ["counters"] }
opener = "0.9"
oidc = { path = "../oidc" }
service = { path = "../service" }
ureq = { workspace = true, features = ["rustls", "platform-verifier"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
blocking = "1"
arc-swap.workspace = true

[dev-dependencies]
testkit = { path = "../testkit" }
walkdir = "2"
tempfile = "3"

[lints]
workspace = true
